<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>Notion Chat Focus</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
    width: 280px;
    padding: 14px;
    background: #1f1f1f;
    color: #eee;
  }
  h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 8px;
    border: 1px solid #3a3a3a;
    background: #2a2a2a;
    color: #eee;
    cursor: pointer;
    font-size: 13px;
    text-align: right;
    font-family: inherit;
  }
  .btn:hover { background: #333; }
  .btn.active { background: #3a6cf0; border-color: #3a6cf0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; flex-shrink: 0; }
  .btn.active .dot { background: #fff; }
  .reset {
    margin-top: 4px;
    background: transparent;
    border: 1px dashed #555;
    color: #aaa;
    justify-content: center;
  }
  .reset:hover { background: #2a2a2a; }
  .slider-wrap {
    margin: 14px 0 10px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
  }
  .slider-wrap label { font-size: 12px; display: block; margin-bottom: 6px; }
  .slider-wrap input[type="range"] { width: 100%; accent-color: #3a6cf0; }
  .slider-wrap .hint { font-size: 11px; color: #999; margin-top: 6px; line-height: 1.6; }
  .status { font-size: 11px; color: #888; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
  <h1>🧭 نمایش/مخفی‌کردن بخش‌های چت</h1>
  <button class="btn" id="btnCode" data-key="code">
    <span>مخفی‌کردن کدها</span><span class="dot"></span>
  </button>
  <button class="btn" id="btnPrompts" data-key="prompts">
    <span>مخفی‌کردن پرامپت‌های من</span><span class="dot"></span>
  </button>
  <button class="btn" id="btnExplanations" data-key="explanations">
    <span>مخفی‌کردن توضیحات غیرکد</span><span class="dot"></span>
  </button>

  <div class="slider-wrap">
    <label for="percentRange">شامل‌شدن تا ین ابتدای چت: <span id="percentValue">100</span>%</label>
    <input type="range" id="percentRange" min="0" max="100" step="5" value="100" />
    <div class="hint">مثلاً روی ۵۰٪ یعنی فقط نیمهی قدیمی‌تر چت شامل حذف‌ها می‌شود؛ نیمهی جدیدتر همیشه کامل نمایش داده می‌شود.</div>
  </div>

  <button class="btn reset" id="btnResetAll">
    <span>نمایش همه (ریست)</span>
  </button>
  <div class="status" id="statusLine">در حال بررسی وضعیت…</div>
  <script src="popup.js"></script>
</body>
</html>
